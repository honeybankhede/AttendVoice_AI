services:
  postgres:
    image: postgres:16
    container_name: attendvoice-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: attendvoice_db
      POSTGRES_USER: attendvoice
      POSTGRES_PASSWORD: attendvoice_dev_password
    ports:
      - "5432:5432"
    volumes:
      - attendvoice_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendvoice -d attendvoice_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  attendvoice_pgdata:
